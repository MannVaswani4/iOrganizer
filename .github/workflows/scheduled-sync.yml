name: iOrganizer scheduled sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due Google sync
        env:
          IORGANIZER_URL: ${{ secrets.IORGANIZER_URL }}
          IORGANIZER_CRON_SECRET: ${{ secrets.IORGANIZER_CRON_SECRET }}
        run: |
          if [ -z "$IORGANIZER_URL" ] || [ -z "$IORGANIZER_CRON_SECRET" ]; then
            echo "Set IORGANIZER_URL and IORGANIZER_CRON_SECRET in repository Actions secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 120 \
            -X POST "${IORGANIZER_URL%/}/api/v1/internal/sync" \
            -H "Authorization: Bearer ${IORGANIZER_CRON_SECRET}"
